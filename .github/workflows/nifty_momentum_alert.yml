name: AntiGravity Smart Money Dual Track Radar (Daily 5 PM)

on:
  schedule:
    # Runs Monday through Friday at 05:00 PM IST (11:30 AM UTC)
    - cron: '30 11 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  run-screener-alert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute 5:00 PM NSE Market Lens Screener & Generate Dashboard
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python nifty_momentum_bot.py

      - name: Commit & Publish Updated Web Dashboard
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add docs/index.html dashboard.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update live radar dashboard [skip ci]" && git push)
